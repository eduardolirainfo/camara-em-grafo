services:
  neo4j:
    image: neo4j:5.26-community
    container_name: camara-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD no .env}"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    container_name: camara-api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Defina NEO4J_PASSWORD no .env}"
      API_INTROSPECCAO_HABILITADA: "${API_INTROSPECCAO_HABILITADA:-true}"
      API_GRAPHIQL_HABILITADO: "${API_GRAPHIQL_HABILITADO:-true}"
      API_RATE_LIMIT_REQUISICOES: "${API_RATE_LIMIT_REQUISICOES:-60}"
    volumes:
      - ./cache:/app/cache

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
